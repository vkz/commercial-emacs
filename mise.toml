[env]
CLMACS_BUILD_DIR = "build/macos-tty"

[tools]
# SBCL is the intended host runtime for clemacs bring-up (Option B).
#
# Note: the mise sbcl plugin builds SBCL from source and requires a host CL
# implementation during install. On macOS, installing ECL via Homebrew works:
#   brew install ecl
sbcl = "2.6.0"
